# User overrides for /etc/makepkg.conf (AUR builds). Delete this file to revert.

# Parallel make for C/C++ (system default is single-job). Lower to -j8 if a big C++ build runs out of RAM.
MAKEFLAGS="-j$(nproc)"

# ccache: reuse C/C++ object files when rebuilding (needs `pacman -S ccache`).
# !check: skip test suites (e.g. `cargo test` in spotatui's PKGBUILD). Use `makepkg --check` to run them.
BUILDENV=(!distcc color ccache !check !sign)

# !debug: no separate -debug package; !lto: faster linking, slightly larger/slower binaries.
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug !lto)

# mold: much faster linker (needs `pacman -S mold`). Comment out if one package fails to link.
LDFLAGS+=" -fuse-ld=mold"
